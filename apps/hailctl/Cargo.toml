[package]
name = "hailctl"
# Tracks the provider release version (apps/server/package.json); checked on release.
version = "0.2.0"
edition = "2024"
publish = false

[[bin]]
name = "hailctl"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
bs58 = "0.5"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = "2"
flate2 = "1"
inquire = "0.7"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tar = "0.4"
toml = "0.8"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
